name: Draft

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  pull-requests: read

jobs:
  update:
    name: Update
    runs-on: ubuntu-latest
    steps:
      - name: Update Draft Release
        uses: release-drafter/release-drafter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
